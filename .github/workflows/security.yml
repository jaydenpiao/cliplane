name: Secrets
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          scan_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scan_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 3 "$release/$archive" -o "$scan_dir/$archive"
          curl -fsSL --retry 3 "$release/$checksums" -o "$scan_dir/$checksums"
          (cd "$scan_dir" && sha256sum --ignore-missing --check "$checksums")
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --redact --no-banner --log-opts=--all
