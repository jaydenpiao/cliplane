name: Cloud discovery
on:
  workflow_dispatch:
  repository_dispatch:
    types: [cloud-discovery]
permissions:
  contents: read
concurrency:
  group: cloud-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'jaydenpiao/cliplane' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate discovery target
        id: target
        env:
          CONFIG_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CONFIG_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CONFIG_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: node scripts/cloud/discover.mjs configure
      - name: Authenticate with short-lived federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.target.outputs.project_id }}
          workload_identity_provider: ${{ steps.target.outputs.provider }}
          service_account: ${{ steps.target.outputs.service_account }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify project and discovery permissions
        env:
          CLOUD_PROJECT_ID: ${{ steps.target.outputs.project_id }}
          CLOUD_PROVIDER: ${{ steps.target.outputs.provider }}
          CLOUD_SERVICE_ACCOUNT: ${{ steps.target.outputs.service_account }}
          CLOUD_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/cloud/discover.mjs verify
