name: Quality
on:
  repository_dispatch:
    types: [cliplane-pilot-package]
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cliplane
          POSTGRES_PASSWORD: cliplane_local
          POSTGRES_DB: cliplane
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U cliplane -d cliplane"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install host media verification tools if needed
        timeout-minutes: 8
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - run: uv sync --locked --group dev
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run db:migrate && npm run db:migrate
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format=spdx > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.spdx.json
  browser:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cliplane
          POSTGRES_PASSWORD: cliplane_local
          POSTGRES_DB: cliplane
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U cliplane -d cliplane"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host media verification tools if needed
        timeout-minutes: 8
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run dev > /tmp/cliplane.log 2>&1 &
      - run: node scripts/wait-ready.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            work/e2e-results
            /tmp/cliplane.log
  container:
    if: >-
      github.event_name != 'repository_dispatch' ||
      (github.repository == 'jaydenpiao/cliplane' &&
       github.ref == 'refs/heads/main' &&
       github.event.action == 'cliplane-pilot-package')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pilot package request
        if: github.event_name == 'repository_dispatch'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/package-pilot.mjs "$RUNNER_TEMP/cliplane-pilot-recipient.pem"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: docker build -f infra/Dockerfile -t cliplane:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host media verification tools if needed
        timeout-minutes: 8
        run: bash scripts/install-ci-ffmpeg.sh
      - name: Build dedicated decoder image
        timeout-minutes: 8
        run: docker build -f workers/media/Decoder.Dockerfile -t cliplane-decoder:ci workers/media
      - name: Check decoder controllers and synthetic media transfer
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          decoder_image_id="$(docker image inspect --format '{{.Id}}' cliplane-decoder:ci)"
          python3 -B scripts/decoder/smoke.py --image "$decoder_image_id"
      - name: Install managed Chromium for production smoke
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: Exercise the production app image over HTTPS
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          app_image_id="$(docker image inspect --format '{{.Id}}' cliplane:ci)"
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            export CLIPLANE_SMOKE_EVIDENCE="$RUNNER_TEMP/cliplane-production-smoke.json"
          fi
          bash scripts/production-smoke.sh "$app_image_id"
      - name: Seal the smoke-tested image package
        if: github.event_name == 'repository_dispatch'
        timeout-minutes: 8
        run: |
          bash scripts/package-pilot.sh "$RUNNER_TEMP/cliplane-production-smoke.json" \
            "$RUNNER_TEMP/cliplane-pilot-recipient.pem" "$RUNNER_TEMP/cliplane-pilot.cms"
      - name: Retain the encrypted pilot package
        if: github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cliplane-pilot-images
          path: ${{ runner.temp }}/cliplane-pilot.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
