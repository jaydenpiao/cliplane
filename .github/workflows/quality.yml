name: Quality
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cliplane
          POSTGRES_PASSWORD: cliplane_local
          POSTGRES_DB: cliplane
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U cliplane -d cliplane"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install host media verification tools if needed
        timeout-minutes: 8
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - run: uv sync --locked --group dev
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run db:migrate && npm run db:migrate
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format=spdx > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.spdx.json
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cliplane
          POSTGRES_PASSWORD: cliplane_local
          POSTGRES_DB: cliplane
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U cliplane -d cliplane"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host media verification tools if needed
        timeout-minutes: 8
        run: bash scripts/install-ci-ffmpeg.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run dev > /tmp/cliplane.log 2>&1 &
      - run: node scripts/wait-ready.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            work/e2e-results
            /tmp/cliplane.log
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: docker build -f infra/Dockerfile -t cliplane:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host media verification tools if needed
        timeout-minutes: 8
        run: bash scripts/install-ci-ffmpeg.sh
      - name: Build dedicated decoder image
        timeout-minutes: 8
        run: docker build -f workers/media/Decoder.Dockerfile -t cliplane-decoder:ci workers/media
      - name: Check decoder controllers and synthetic media transfer
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          decoder_image_id="$(docker image inspect --format '{{.Id}}' cliplane-decoder:ci)"
          python3 -B scripts/decoder/smoke.py --image "$decoder_image_id"
      - name: Install managed Chromium for production smoke
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: Exercise the production app image over HTTPS
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          app_image_id="$(docker image inspect --format '{{.Id}}' cliplane:ci)"
          bash scripts/production-smoke.sh "$app_image_id"
