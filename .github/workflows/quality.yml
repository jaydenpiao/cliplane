name: Quality
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cliplane
          POSTGRES_PASSWORD: cliplane_local
          POSTGRES_DB: cliplane
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U cliplane -d cliplane"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: uv sync --locked --group dev
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run db:migrate && npm run db:migrate
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format=spdx > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.spdx.json
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cliplane
          POSTGRES_PASSWORD: cliplane_local
          POSTGRES_DB: cliplane
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U cliplane -d cliplane"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run dev > /tmp/cliplane.log 2>&1 &
      - run: node scripts/wait-ready.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: work/e2e-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t cliplane:ci .
