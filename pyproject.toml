[project]
name = "cliplane-media"
version = "0.1.0"
description = "Stateless FFmpeg workers for Cliplane"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
